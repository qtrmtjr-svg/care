<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-box {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .login-box input[type="email"],
        .login-box input[type="password"] {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: white;
        }
        .login-box .btn-primary {
            background-color: #6366f1;
            border: none;
        }
        .login-box .btn-primary:hover {
            background-color: #4f46e5;
        }
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo img {
            width: 50px;
        }
        .text-sm {
            font-size: 0.875rem;
        }
        .form-check-label {
            color: #cbd5e1;
        }
        a {
            color: #94a3b8;
        }
        a:hover {
            color: #e2e8f0;
        }
    </style>
</head>
<body>
    <form class="login-box" method="POST" action="admin/login">
        <input type="hidden" name="_token" value="XE5raZAPd8Tbs9bxcRp8wfTxiOem9ditiW5cOvzv" autocomplete="off">        <div class="logo">
            <img src="images/logo-icon.png" alt="Logo">
        </div>

        
        
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input name="password" type="password" class="form-control" required>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="remember" id="remember">
                <label class="form-check-label text-sm" for="remember">
                    Remember me
                </label>
            </div>
            <a href="#" class="text-sm">Forgot your password?</a>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-primary">LOG IN</button>
        </div>
    </form>
</body>
</html>
